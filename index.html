<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafi Ultimate Portfolio</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#030712;color:#e2e8f0;overflow-x:hidden}

/* LOADER */
#loader{position:fixed;inset:0;background:#020617;display:flex;justify-content:center;align-items:center;z-index:9999}
.loader-bar{width:200px;height:4px;background:#1e293b}
.loader-bar div{height:100%;width:0;background:#38bdf8;animation:load 3s forwards}
@keyframes load{to{width:100%}}

/* NAV */
nav{position:fixed;width:100%;top:0;padding:15px 20px;display:flex;justify-content:space-between;background:rgba(0,0,0,0.4);backdrop-filter:blur(10px);z-index:999}
nav a{color:#94a3b8;margin-left:15px;text-decoration:none}

.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero h1{font-size:clamp(40px,8vw,80px);background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;color:transparent}

.typing{margin-top:10px;font-family:'JetBrains Mono'}
.btn{margin-top:20px;padding:12px 25px;background:#38bdf8;border:none;color:black;border-radius:10px}

section{padding:80px 20px}
h2{text-align:center;margin-bottom:30px}

.card{
 background:rgba(255,255,255,0.05);
 border:1px solid rgba(255,255,255,0.1);
 padding:20px;border-radius:15px;
 opacity:0;
 transform:translateY(80px) scale(0.95);
 transition:all 0.8s ease;
}
.card.show{
 opacity:1;
 transform:translateY(0) scale(1);
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}

.parallax{height:300px;background:url('https://picsum.photos/1000/600?blur=3') center/cover fixed;border-radius:20px}

.terminal{background:black;padding:15px;border-radius:10px;font-family:monospace;color:#38bdf8}

.floating{position:fixed;bottom:20px;right:20px;background:#38bdf8;color:black;padding:15px;border-radius:50%;cursor:pointer}

.touch-glow{position:fixed;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#38bdf855,transparent);pointer-events:none;transform:translate(-50%,-50%)}

footer{text-align:center;padding:30px;color:#64748b}
</style></head><body><div id="loader"><div class="loader-bar"><div></div></div></div><nav>
 <div>Rafi</div>
 <div>
  <a href="#about">About</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
 </div>
</nav><section class="hero">
 <h1>Rafi Akbar</h1>
 <div class="typing" id="typing"></div>
 <button class="btn" onclick="scrollTo('projects')">Explore</button>
</section><section id="about">
 <h2>About</h2>
 <div class="card reveal">Gw bikin web absurd, interaktif, dan aesthetic.</div>
</section><div class="parallax"></div><section id="projects">
 <h2>Projects</h2>
 <div class="grid">
  <div class="card reveal">Interactive Web</div>
  <div class="card reveal">Game UI</div>
  <div class="card reveal">Creative Landing</div>
  <div class="card reveal">Experimental Site</div>
 </div>
</section><section>
 <h2>Console</h2>
 <div class="terminal reveal" id="terminal"></div>
</section><section id="contact">
 <h2>Contact</h2>
 <div class="card reveal">rafi@email.com</div>
</section><div class="floating" onclick="easterEgg()">?</div>
<footer>© 2026 Rafi</footer><script>

/* LOADER */
setTimeout(()=>loader.style.display='none',2500)

/* TYPING */
const txt="Dark UI • Interactive • Experimental";
let i=0
function type(){if(i<txt.length){typing.innerHTML+=txt[i];i++;setTimeout(type,40)}}
type()

/* SCROLL */
function scrollTo(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}

/* TERMINAL */
const lines=["> booting...","> loading...","> welcome user","> ready"];
let l=0
function run(){if(l<lines.length){terminal.innerHTML+=lines[l]+"<br>";l++;setTimeout(run,500)}}
run()

/* TOUCH GLOW */
const glow=document.createElement('div')
glow.className='touch-glow'
document.body.appendChild(glow)

window.addEventListener('mousemove',e=>{
 glow.style.left=e.clientX+'px'
 glow.style.top=e.clientY+'px'
})
window.addEventListener('touchmove',e=>{
 glow.style.left=e.touches[0].clientX+'px'
 glow.style.top=e.touches[0].clientY+'px'
})

/* SCROLL POPUP ANIMATION */
const reveals=document.querySelectorAll('.reveal')

function revealOnScroll(){
 const trigger=window.innerHeight * 0.85
 reveals.forEach((el,index)=>{
  const top=el.getBoundingClientRect().top
  if(top<trigger){
    setTimeout(()=>{el.classList.add('show')}, index*120)
  }
 })
}

window.addEventListener('scroll',revealOnScroll)
revealOnScroll()

/* PARTICLE */
const c=document.createElement('canvas')
document.body.appendChild(c)
const ctx=c.getContext('2d')
c.style.position='fixed'
c.style.zIndex='-1'
c.width=innerWidth
c.height=innerHeight

let p=[]
for(let i=0;i<100;i++){
 p.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:Math.random()-0.5,vy:Math.random()-0.5})
}

function anim(){
 ctx.clearRect(0,0,c.width,c.height)
 p.forEach(a=>{
  a.x+=a.vx;a.y+=a.vy
  ctx.fillStyle='#38bdf8'
  ctx.fillRect(a.x,a.y,2,2)
 })
 requestAnimationFrame(anim)
}
anim()

/* EASTER */
function easterEgg(){alert('🔥 lu nemu hidden feature 🔥')}

</script></body>
</html>
